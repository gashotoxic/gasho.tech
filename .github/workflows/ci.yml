name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The auth tests run TypeScript directly via --experimental-strip-types
          # (Node 22.6+); the build job below stays on Node 20 for Vercel parity.
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (auth + rate limiting)
        run: npm test

      # The archive's size is a live risk with two named edges — 1 MB (every read
      # becomes two requests) and the 20 MB decode ceiling (nothing can be read or
      # written). `npm run check:blogs-size` printed both but ran nowhere, so a
      # drift between deploys went unseen until a publish 500'd. It runs on Node 22
      # because it imports lib/github.ts through --experimental-strip-types.
      - name: Blog archive size
        run: npm run check:blogs-size

  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Tier 1 gate guard
        run: node scripts/check-tier1-gate.mjs

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
